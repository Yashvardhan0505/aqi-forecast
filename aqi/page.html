<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONT_URL}}">
<style>
:root {
  color-scheme: light;
  --page: #ffffff;
  --ink: #191919;
  --ink-2: #666666;
  --grid: #e7e7e7;
  --axis: #c2c2c2;
  --rule: rgba(11, 11, 11, 0.10);
  --accent: #257de0;
  --accent-wash: rgba(37, 125, 224, 0.12);
  --muted: #9c9c9c;
  --banner: #fdf1c7;
  --code: #f1f1f1;
  --font: "Anek Latin", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #191919;
    --ink: #efefef;
    --ink-2: #9c9c9c;
    --grid: #303030;
    --axis: #474747;
    --rule: rgba(255, 255, 255, 0.10);
    --accent: #338ced;
    --accent-wash: rgba(51, 140, 237, 0.20);
    --muted: #666666;
    --banner: #3b3420;
    --code: #262626;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
}
main { max-width: 1040px; margin: 0 auto; padding: 48px 24px 72px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
p { margin: 0; }

h1 {
  font-size: clamp(36px, 5.4vw, 58px);
  line-height: 1;
  font-weight: 650;
  font-variation-settings: "wdth" 80;
  letter-spacing: -0.015em;
  margin: 0 0 14px;
}
.lede { font-size: 19px; max-width: 56ch; }
.meta { color: var(--ink-2); font-size: 15px; margin: 10px 0 28px; max-width: 78ch; }
.banner { background: var(--banner); padding: 10px 14px; border-radius: 6px; margin: 0 0 28px; font-size: 15px; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* City switcher: each city with today's forecast AQI. */
.cities ul { list-style: none; margin: 0 0 26px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.cities a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
  line-height: 1.3;
}
.cities a:hover { border-color: var(--axis); }
.cities a[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.nav-name { font-weight: 600; }
.nav-aqi { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cities a[aria-current="page"] .nav-aqi { color: inherit; }
.dot-none { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-2); }

/* The forecast strip: one continuous sky, tinted by each day's forecast. */
.sky {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2px;
  border-radius: 12px;
  overflow: hidden;
}
.day {
  background: var(--bg);
  color: var(--ink-on);
  padding: 20px 22px 22px;
  min-height: 252px;
  display: flex;
  flex-direction: column;
}
.when { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
.aqi { margin: 12px 0 0; display: flex; align-items: baseline; gap: 8px; line-height: 0.86; }
.aqi .num {
  font-size: clamp(76px, 10.5vw, 124px);
  font-weight: 600;
  font-variation-settings: "wdth" 75;
  letter-spacing: -0.02em;
}
.aqi .unit { font-size: 16px; font-weight: 600; color: var(--ink-on-2); }
.cat { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }
.pm { margin-top: auto; padding-top: 18px; font-size: 15px; line-height: 1.4; color: var(--ink-on-2); }
.note { color: var(--ink-2); font-size: 14px; margin-top: 12px; max-width: 78ch; }
.notice { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 22px; max-width: 70ch; }

.block { margin-top: 68px; }
h2 {
  font-size: 30px;
  line-height: 1.1;
  font-weight: 600;
  font-variation-settings: "wdth" 86;
  margin: 0 0 6px;
}
h3 { font-size: 18px; font-weight: 600; margin: 0; }
.sub { color: var(--ink-2); margin-bottom: 16px; max-width: 70ch; }
.headline { font-size: 21px; line-height: 1.4; margin: 0 0 8px; max-width: 58ch; }

.legend {
  list-style: none;
  padding: 0;
  margin: 0 0 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 22px;
  font-size: 14px;
  color: var(--ink-2);
}
.legend li { display: flex; align-items: center; gap: 8px; }
.key { display: inline-block; width: 18px; height: 2px; border-radius: 1px; flex: none; }
.key-measured { background: var(--ink); }
.key-forecast { background: var(--accent); }
.key-band { height: 10px; background: var(--accent-wash); border-radius: 2px; }
.chart { position: relative; min-height: 260px; touch-action: pan-y; }
.chart:focus-visible { outline-offset: 6px; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 12px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart-fallback { color: var(--ink-2); padding-top: 40px; }
.caption { color: var(--ink-2); font-size: 14px; margin-top: 10px; max-width: 78ch; }
.tip {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  background: var(--page);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 8px 11px 9px;
  font-size: 14px;
  line-height: 1.4;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
  white-space: nowrap;
}
.tip[hidden] { display: none; }
.tip-date { color: var(--ink-2); margin-bottom: 3px; }
.tip-row { display: flex; align-items: center; gap: 7px; }
.tip-row strong { font-weight: 650; font-size: 15px; }
.tip-row .lbl { color: var(--ink-2); }
.tip-cat { color: var(--ink-2); margin-top: 3px; }

.acc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px 44px; margin-top: 22px; }
.acc-sub { color: var(--ink-2); font-size: 14px; margin: 2px 0 12px; min-height: 2.8em; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 9.4em minmax(0, 1fr); align-items: center; gap: 10px; font-size: 15px; }
.bar-label { color: var(--ink-2); line-height: 1.2; }
.is-model .bar-label { color: var(--ink); font-weight: 600; }
.bar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar {
  height: 16px;
  width: calc((100% - 3.4em) * var(--w));
  min-width: 2px;
  flex: none;
  background: var(--muted);
  border-radius: 0 4px 4px 0;
}
.is-model .bar { background: var(--accent); }
.bar-value { font-variant-numeric: tabular-nums; }

details { margin-top: 16px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 15px; width: fit-content; }
summary:hover { color: var(--ink); }
.table-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 0 6px 18px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { color: var(--ink-2); font-weight: 500; border-bottom-color: var(--axis); }
tbody th { font-weight: 500; }

.method { max-width: 70ch; }
.method p + p { margin-top: 14px; }
code { font-size: 0.9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
footer { margin-top: 68px; padding-top: 18px; border-top: 1px solid var(--grid); color: var(--ink-2); font-size: 14px; }
footer p { max-width: 78ch; }

@media (max-width: 639px) {
  main { padding: 28px 16px 56px; }
  .sky { grid-template-columns: 1fr; }
  .day {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "when aqi" "cat aqi" "pm aqi";
    column-gap: 14px;
    padding: 16px 18px;
  }
  .when { grid-area: when; }
  .aqi { grid-area: aqi; margin: 0; align-self: center; }
  .aqi .num { font-size: 66px; }
  .aqi .unit { font-size: 14px; }
  .cat { grid-area: cat; margin-top: 6px; }
  .pm { grid-area: pm; margin: 0; padding-top: 6px; }
  .block { margin-top: 52px; }
}
@media (forced-colors: active) {
  .bar { background: CanvasText; }
  .is-model .bar { background: Highlight; }
  .dot { forced-color-adjust: none; }
}
</style>
</head>
<body>
<main>
{{BANNER}}
{{NAV}}
<header>
{{HEADER}}
</header>
{{HERO}}
<section class="block" aria-labelledby="trend-h">
{{TREND}}
</section>
<section class="block" aria-labelledby="acc-h">
<h2 id="acc-h">How accurate is it?</h2>
{{ACCURACY}}
</section>
<section class="block" aria-labelledby="how-h">
<h2 id="how-h">How it works</h2>
{{METHOD}}
</section>
<footer>
{{FOOTER}}
</footer>
</main>
<script type="application/json" id="page-data">{{DATA_JSON}}</script>
<script>
(function () {
  "use strict";
  // Opened from disk (file://), folder links don't load index.html by themselves.
  if (location.protocol === "file:") {
    document.querySelectorAll(".cities a").forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href") + "index.html");
    });
  }
  var DATA = JSON.parse(document.getElementById("page-data").textContent);
  var host = document.getElementById("trend-chart");
  var chart = DATA.chart;
  if (!host || !chart || !chart.measured.length) return;

  var NS = "http://www.w3.org/2000/svg";
  var DAY = 864e5;
  // Fixed names (not Intl) so dates match the server-rendered tables in every browser.
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var fmtShort = { format: function (t) { var d = new Date(t); return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; } };
  var fmtLong = { format: function (t) { return WEEKDAYS[new Date(t).getUTCDay()] + " " + fmtShort.format(t); } };

  function toTime(d) { return Date.parse(d + "T00:00:00Z"); }
  function svg(tag, attrs, parent) {
    var node = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(node);
    return node;
  }
  function label(parent, x, y, text, anchor) {
    var t = svg("text", { x: x, y: y, "text-anchor": anchor || "start" }, parent);
    t.textContent = text;
    return t;
  }
  function categoryOf(v) {
    for (var i = 0; i < DATA.bands.length; i++) if (v <= DATA.bands[i][0]) return DATA.bands[i][1];
    return DATA.bands[DATA.bands.length - 1][1];
  }
  function niceMax(v) {
    var steps = [40, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 250) * 250;
  }

  // One entry per date with whatever exists for it: measured, forecast, range.
  var byDate = new Map();
  function slot(d) {
    if (!byDate.has(d)) byDate.set(d, { d: d, t: toTime(d), v: null, p: null, lo: null, hi: null, src: null });
    return byDate.get(d);
  }
  chart.measured.forEach(function (r) { slot(r[0]).v = r[1]; });
  chart.forecast.forEach(function (r) { var s = slot(r[0]); s.p = r[1]; s.lo = r[2]; s.hi = r[3]; s.src = r[4]; });
  chart.future.forEach(function (r) { var s = slot(r[0]); s.p = r[1]; s.lo = r[2]; s.hi = r[3]; s.src = "future"; });
  var points = Array.from(byDate.values()).sort(function (a, b) { return a.t - b.t; });
  var lastMeasuredIdx = 0;
  points.forEach(function (o, i) { if (o.v != null) lastMeasuredIdx = i; });

  var tip = document.createElement("div");
  tip.className = "tip";
  tip.hidden = true;
  tip.setAttribute("aria-live", "polite");
  var geom = null;
  var current = null;

  function runs(list, ok) {
    var out = [], cur = [];
    list.forEach(function (o) {
      var good = ok(o);
      if (!good || (cur.length && o.t - cur[cur.length - 1].t > 1.5 * DAY)) {
        if (cur.length) out.push(cur);
        cur = [];
      }
      if (good) cur.push(o);
    });
    if (cur.length) out.push(cur);
    return out;
  }

  function draw() {
    var width = host.clientWidth;
    if (!width) return;
    var narrow = width < 620;
    var height = narrow ? 270 : 340;
    var m = { top: 28, right: narrow ? 10 : 150, bottom: 30, left: 38 };
    var pw = width - m.left - m.right;
    var ph = height - m.top - m.bottom;
    var t0 = points[0].t, t1 = points[points.length - 1].t;
    var ymax = 1;
    points.forEach(function (o) { [o.v, o.p, o.hi].forEach(function (v) { if (v != null && v > ymax) ymax = v; }); });
    ymax = niceMax(ymax * 1.04);
    function x(t) { return m.left + (t1 === t0 ? pw / 2 : ((t - t0) / (t1 - t0)) * pw); }
    function y(v) { return m.top + ph - (v / ymax) * ph; }

    host.replaceChildren();
    var root = svg("svg", { width: width, height: height, viewBox: "0 0 " + width + " " + height, "aria-hidden": "true" }, host);
    host.appendChild(tip);

    // Horizontal grid at the CPCB category boundaries; names in the right margin.
    var lastY = Infinity;
    [0].concat(DATA.bands.map(function (b) { return b[0]; }).filter(function (v) { return v < ymax; }))
      .forEach(function (v) {
        var yy = Math.round(y(v)) + 0.5;
        svg("line", { x1: m.left, x2: m.left + pw, y1: yy, y2: yy, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, root);
        if (lastY - yy >= 14) { label(root, m.left - 8, yy + 4, String(v), "end"); lastY = yy; }
      });
    if (!narrow) {
      var lo = 0;
      DATA.bands.forEach(function (b) {
        var hi = Math.min(b[0], ymax);
        if (lo < ymax && y(lo) - y(hi) >= 15) label(root, m.left + pw + 14, (y(lo) + y(hi)) / 2 + 4, b[1]);
        lo = b[0];
      });
    }

    // Dates along the bottom: the 1st (and on wide screens the 15th) of each month.
    var first = new Date(t0);
    var month = Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1);
    while (month <= t1) {
      var md = new Date(month);
      [1, 15].forEach(function (day) {
        var tt = Date.UTC(md.getUTCFullYear(), md.getUTCMonth(), day);
        var xx = x(tt);
        if (tt < t0 || tt > t1 || (narrow && day !== 1) || xx < m.left + 14 || xx > m.left + pw - 14) return;
        label(root, xx, m.top + ph + 20, fmtShort.format(tt), "middle");
      });
      month = Date.UTC(md.getUTCFullYear(), md.getUTCMonth() + 1, 1);
    }

    // Today, and where live forecasts start replacing the backtest.
    var today = toTime(DATA.today);
    var todayX = null;
    if (today >= t0 && today <= t1) {
      todayX = Math.round(x(today)) + 0.5;
      svg("line", { x1: todayX, x2: todayX, y1: m.top - 8, y2: m.top + ph, stroke: "var(--axis)", "stroke-width": 1 }, root);
      label(root, todayX, m.top - 13, "Today", todayX > width - 24 ? "end" : "middle");
    }
    // Only mark it once there's room; in the first days of live tracking the caption explains.
    if (chart.liveStart) {
      var ls = toTime(chart.liveStart);
      var lx = Math.round(x(ls)) + 0.5;
      if (ls > t0 && ls < t1 && (todayX === null || Math.abs(todayX - lx) > 110) && lx - m.left > 70) {
        svg("line", { x1: lx, x2: lx, y1: m.top - 8, y2: m.top + ph, stroke: "var(--axis)", "stroke-width": 1 }, root);
        label(root, lx - 6, m.top - 13, "Backtest", "end");
        label(root, lx + 6, m.top - 13, "Live", "start");
      }
    }

    // Forecast range, then lines, measured on top.
    var fc = points.filter(function (o) { return o.src !== null; });
    runs(fc, function (o) { return o.lo != null && o.hi != null; }).forEach(function (r) {
      if (r.length < 2) return;
      var top = r.map(function (o) { return x(o.t).toFixed(1) + "," + y(o.hi).toFixed(1); });
      var bot = r.slice().reverse().map(function (o) { return x(o.t).toFixed(1) + "," + y(o.lo).toFixed(1); });
      svg("path", { d: "M" + top.join("L") + "L" + bot.join("L") + "Z", fill: "var(--accent-wash)" }, root);
    });
    function line(list, key, color) {
      runs(list, function (o) { return o[key] != null; }).forEach(function (r) {
        if (r.length === 1) {
          svg("circle", { cx: x(r[0].t), cy: y(r[0][key]), r: 2, fill: color }, root);
          return;
        }
        var d = "M" + r.map(function (o) { return x(o.t).toFixed(1) + "," + y(o[key]).toFixed(1); }).join("L");
        svg("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, root);
      });
    }
    line(fc, "p", "var(--accent)");
    line(points, "v", "var(--ink)");
    points.forEach(function (o) {
      if (o.src === "future" && o.p != null) {
        svg("circle", { cx: x(o.t), cy: y(o.p), r: 4.5, fill: "var(--accent)", stroke: "var(--page)", "stroke-width": 2 }, root);
      }
    });

    // Hover layer: a crosshair that snaps to the nearest day.
    var cross = svg("line", { y1: m.top, y2: m.top + ph, stroke: "var(--ink-2)", "stroke-width": 1, visibility: "hidden" }, root);
    var dotP = svg("circle", { r: 4.5, fill: "var(--accent)", stroke: "var(--page)", "stroke-width": 2, visibility: "hidden" }, root);
    var dotV = svg("circle", { r: 4.5, fill: "var(--ink)", stroke: "var(--page)", "stroke-width": 2, visibility: "hidden" }, root);
    var hit = svg("rect", { x: m.left - 6, y: 0, width: pw + 12, height: height, fill: "transparent" }, root);
    geom = { x: x, y: y, m: m, width: width, cross: cross, dotV: dotV, dotP: dotP };
    hit.addEventListener("pointermove", function (ev) {
      var box = root.getBoundingClientRect();
      show(nearest(ev.clientX - box.left));
    });
    hit.addEventListener("pointerleave", hide);
    if (current !== null) show(current);
  }

  function nearest(px) {
    var best = 0, bestDist = Infinity;
    points.forEach(function (o, i) {
      var dist = Math.abs(geom.x(o.t) - px);
      if (dist < bestDist) { best = i; bestDist = dist; }
    });
    return best;
  }

  function place(dot, value, xx) {
    if (value == null) { dot.setAttribute("visibility", "hidden"); return; }
    dot.setAttribute("cx", xx);
    dot.setAttribute("cy", geom.y(value));
    dot.setAttribute("visibility", "visible");
  }

  function add(parent, tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    parent.appendChild(node);
    return node;
  }

  function row(color, value, text) {
    var r = add(tip, "div", "tip-row");
    var key = add(r, "span", "key");
    key.style.background = color;
    add(r, "strong", null, String(Math.round(value)));
    add(r, "span", "lbl", text);
  }

  function show(i) {
    if (!geom) return;
    current = i;
    var o = points[i];
    var xx = geom.x(o.t);
    geom.cross.setAttribute("x1", xx);
    geom.cross.setAttribute("x2", xx);
    geom.cross.setAttribute("visibility", "visible");
    place(geom.dotV, o.v, xx);
    place(geom.dotP, o.p, xx);

    tip.replaceChildren();
    add(tip, "div", "tip-date", fmtLong.format(o.t));
    if (o.v != null) row("var(--ink)", o.v, "µg/m³ measured");
    if (o.p != null) {
      var what = o.src === "future" ? "forecast" : o.src === "backtest" ? "backtest forecast" : "forecast";
      if (o.lo != null) what += ", likely " + Math.round(o.lo) + "–" + Math.round(o.hi);
      row("var(--accent)", o.p, what);
    }
    if (o.v == null && o.p == null) add(tip, "div", "tip-cat", "No data");
    else add(tip, "div", "tip-cat", categoryOf(o.v != null ? o.v : o.p) + (o.v != null ? "" : " expected"));
    tip.hidden = false;
    var left = xx + 14;
    if (left + tip.offsetWidth > geom.width) left = xx - 14 - tip.offsetWidth;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = geom.m.top + "px";
  }

  function hide() {
    current = null;
    tip.hidden = true;
    if (!geom) return;
    [geom.cross, geom.dotV, geom.dotP].forEach(function (n) { n.setAttribute("visibility", "hidden"); });
  }

  host.addEventListener("keydown", function (ev) {
    var i = current === null ? lastMeasuredIdx : current;
    if (ev.key === "ArrowLeft") i = Math.max(0, i - 1);
    else if (ev.key === "ArrowRight") i = Math.min(points.length - 1, i + 1);
    else if (ev.key === "Home") i = 0;
    else if (ev.key === "End") i = points.length - 1;
    else if (ev.key === "Escape") { hide(); return; }
    else return;
    ev.preventDefault();
    show(i);
  });
  host.addEventListener("focus", function () { if (current === null) show(lastMeasuredIdx); });
  host.addEventListener("blur", hide);

  var lastWidth = 0;
  function maybeDraw() {
    var w = host.clientWidth;
    if (Math.abs(w - lastWidth) > 1) { lastWidth = w; draw(); }
  }
  if ("ResizeObserver" in window) new ResizeObserver(maybeDraw).observe(host);
  else { window.addEventListener("resize", maybeDraw); maybeDraw(); }
})();
</script>
</body>
</html>
